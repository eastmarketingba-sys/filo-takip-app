appId: com.filotakip.app
productName: Filo Takip
directories:
  output: dist
publish:
  provider: github
  owner: eastmarketingba-sys
  repo: filo-takip-app
  releaseType: release
files:
  - src/**/*
  - package.json
  - node_modules/**/*
win:
  target: nsis
  # icon: build/icon.ico   # özel bir .ico dosyanız olduğunda bu satırı açın
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
